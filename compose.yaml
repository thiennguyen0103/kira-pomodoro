services:
  postgres:
    image: postgres:17-alpine
    container_name: kira-pomodoro-postgres
    environment:
      POSTGRES_USER: kira
      POSTGRES_PASSWORD: kira
      POSTGRES_DB: kira_pomodoro
    ports:
      - "5432:5432"
    volumes:
      - kira_pomodoro_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kira -d kira_pomodoro"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  kira_pomodoro_postgres:
